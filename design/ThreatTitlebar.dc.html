<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="height:56px;flex:none;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #171C2E;font-family:'Segoe UI Variable Display','Segoe UI',system-ui,sans-serif">
  <div style="display:flex;align-items:center;gap:8px;padding-left:28px;font-size:12px">
    <span style="color:#808AA8">Threat Scanner</span>
    <span style="color:#3A4160">/</span>
    <span style="color:#A2AAC4;font-weight:500">{{page}}</span>
  </div>
  <div style="display:flex;height:56px">
    <div style="width:46px;height:56px;display:flex;align-items:center;justify-content:center;color:#A2AAC4" style-hover="background:#181D30;color:#E8EBF5">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"><path d="M4 8h8"></path></svg>
    </div>
    <div style="width:46px;height:56px;display:flex;align-items:center;justify-content:center;color:#A2AAC4" style-hover="background:#181D30;color:#E8EBF5">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"><rect x="4.6" y="4.6" width="6.8" height="6.8" rx="1"></rect></svg>
    </div>
    <div style="width:46px;height:56px;display:flex;align-items:center;justify-content:center;color:#A2AAC4" style-hover="background:#232A44;color:#E8EBF5">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"><path d="M4.6 4.6 11.4 11.4M11.4 4.6 4.6 11.4"></path></svg>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;page&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Home&quot;,&quot;tsType&quot;:&quot;string&quot;}}"></script>
</body>
</html>
