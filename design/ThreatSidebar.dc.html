<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="width:216px;height:100%;flex:none;background:rgba(9,12,24,0.62);border-right:1px solid #1C2238;display:flex;flex-direction:column;padding:18px 0 16px;font-family:'Segoe UI Variable Display','Segoe UI',system-ui,sans-serif">
  <div style="display:flex;align-items:center;gap:8px;padding:0 16px 24px">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#7FA6FF" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.2 19.2 6v6.1c0 4.1-2.9 7.2-7.2 8.7-4.3-1.5-7.2-4.6-7.2-8.7V6L12 3.2Z"></path></svg>
    <span style="font-size:16px;font-weight:600;color:#E8EBF5">Threat Scanner</span>
  </div>
  <div style="display:flex;flex-direction:column;gap:4px;padding:0 8px">
    <div style="position:relative;display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border-radius:8px;border:1px solid transparent;font-size:13px;font-weight:500;background:{{homeBg}};color:{{homeFg}}" style-hover="background:{{homeHover}}">
      <div style="position:absolute;left:-8px;top:10px;width:3px;height:20px;border-radius:0 2px 2px 0;background:{{homeInd}}"></div>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{homeIcon}}" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.2 19.2 6v6.1c0 4.1-2.9 7.2-7.2 8.7-4.3-1.5-7.2-4.6-7.2-8.7V6L12 3.2Z"></path></svg>
      <span>Home</span>
    </div>
    <div style="position:relative;display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border-radius:8px;border:1px solid transparent;font-size:13px;font-weight:500;background:{{scanBg}};color:{{scanFg}}" style-hover="background:{{scanHover}}">
      <div style="position:absolute;left:-8px;top:10px;width:3px;height:20px;border-radius:0 2px 2px 0;background:{{scanInd}}"></div>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{scanIcon}}" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6.2"></circle><path d="m15.6 15.6 4.4 4.4"></path></svg>
      <span>Scan</span>
    </div>
    <div style="position:relative;display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border-radius:8px;border:1px solid transparent;font-size:13px;font-weight:500;background:{{threatsBg}};color:{{threatsFg}}" style-hover="background:{{threatsHover}}">
      <div style="position:absolute;left:-8px;top:10px;width:3px;height:20px;border-radius:0 2px 2px 0;background:{{threatsInd}}"></div>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{threatsIcon}}" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4.4 21 19.6H3L12 4.4Z"></path><path d="M12 9.8v4.4"></path><path d="M12 17h.01"></path></svg>
      <span>Threats</span>
      <div style="margin-left:auto;min-width:24px;height:20px;padding:0 8px;border-radius:6px;background:#3A1420;border:1px solid #7A2434;color:#FF6A78;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center">7</div>
    </div>
    <div style="position:relative;display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border-radius:8px;border:1px solid transparent;font-size:13px;font-weight:500;background:{{quarantineBg}};color:{{quarantineFg}}" style-hover="background:{{quarantineHover}}">
      <div style="position:absolute;left:-8px;top:10px;width:3px;height:20px;border-radius:0 2px 2px 0;background:{{quarantineInd}}"></div>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{quarantineIcon}}" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8.4 12 4.4l8 4v7.2L12 19.6 4 15.6V8.4Z"></path><path d="M4 8.4 12 12.4l8-4"></path><path d="M12 12.4v7.2"></path></svg>
      <span>Quarantine</span>
    </div>
    <div style="position:relative;display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border-radius:8px;border:1px solid transparent;font-size:13px;font-weight:500;background:{{logsBg}};color:{{logsFg}}" style-hover="background:{{logsHover}}">
      <div style="position:absolute;left:-8px;top:10px;width:3px;height:20px;border-radius:0 2px 2px 0;background:{{logsInd}}"></div>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{logsIcon}}" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M8 7h12M8 12h12M8 17h12"></path><path d="M4 7h.01M4 12h.01M4 17h.01"></path></svg>
      <span>Logs</span>
    </div>
  </div>
  <div style="flex:1"></div>
  <div style="padding:0 8px">
    <div style="position:relative;display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border-radius:8px;border:1px solid transparent;font-size:13px;font-weight:500;background:{{settingsBg}};color:{{settingsFg}}" style-hover="background:{{settingsHover}}">
      <div style="position:absolute;left:-8px;top:10px;width:3px;height:20px;border-radius:0 2px 2px 0;background:{{settingsInd}}"></div>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{settingsIcon}}" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"></circle><circle cx="12" cy="12" r="8.4"></circle><path d="M12 3.6v2.4M12 18v2.4M4.9 7.9l2.1 1.2M17 14.9l2.1 1.2M4.9 16.1l2.1-1.2M17 9.1l2.1-1.2"></path></svg>
      <span>Settings</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;scan&quot;,&quot;threats&quot;,&quot;quarantine&quot;,&quot;logs&quot;,&quot;settings&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active || "home";
    const out = {};
    ["home", "scan", "threats", "quarantine", "logs", "settings"].forEach(k => {
      const on = k === active;
      out[k + "Bg"] = on ? "#1B2440" : "transparent";
      out[k + "Hover"] = on ? "#20294C" : "#161B2E";
      out[k + "Fg"] = on ? "#E8EBF5" : "#A2AAC4";
      out[k + "Icon"] = on ? "#7FA6FF" : "#808AA8";
      out[k + "Ind"] = on ? "#7FA6FF" : "transparent";
    });
    return out;
  }
}
</script>
</body>
</html>
